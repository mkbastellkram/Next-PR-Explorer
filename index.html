<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PR Explorer Madeira</title>
<meta name="theme-color" content="#061616"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="PR Explorer">
<link rel="apple-touch-icon" href="./icon-180.png"><link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./style.css">
</head><body>
<div id="app">
  <div id="map"></div>
  <div class="vignette"></div>
  <header class="hero"><div class="kicker">MADEIRA</div><h1>PR Explorer</h1><button id="locateBtn" class="round glass" aria-label="Position"><span>⌖</span></button></header>

  <section id="sheet" class="sheet"><div class="grab"></div><div id="content"></div></section>
  <div id="toast"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./pr-data.js"></script>
<script src="./app.js"></script>
</body></html>
