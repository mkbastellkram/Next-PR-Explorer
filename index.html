<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PR Explorer Madeira · V1.6</title>
<meta name="theme-color" content="#061616"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="PR Explorer">
<link rel="apple-touch-icon" href="./icon-180.png"><link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./style.css">
</head><body>
<div id="app">
  <div id="map"></div>
  <div class="vignette"></div>

  <header id="hero" class="hero">
    <div><div class="kicker">MADEIRA</div><h1>PR Explorer</h1></div>
    <button id="viewBtn" class="round glass" aria-label="Ansicht"><span>⌕</span></button>
    <button id="filterBtn" class="round glass" aria-label="Filter"><span>☷</span></button>
  </header>

  <div id="viewMenu" class="top-menu glass hidden">
    <small>Ansicht</small>
    <button id="locateBtn"><span>⌖</span> Aktueller Standort</button>
    <button id="fitAllBtn"><span>▢</span> Alle PR anzeigen</button>
    <button id="fullscreenBtn"><span>⛶</span> Vollbild-Ansicht</button>
  </div>

  <div id="filterMenu" class="top-menu right glass hidden">
    <small>Filter</small>
    <div class="filterTitle">Region</div>
    <div id="regionFilters" class="filterGrid"></div>
    <div class="filterTitle">Status</div>
    <div id="statusFilters" class="statusFilters"></div>
    <button id="resetFilters" class="menuAction">Filter zurücksetzen</button>
  </div>

  <section id="panel" class="panel glass hidden">
    <div class="panelBar"></div>
    <div id="panelContent"></div>
  </section>

  <section id="detailPanel" class="detailPanel glass hidden">
    <button id="detailClose" class="miniClose">×</button>
    <div class="panelBar"></div>
    <div id="detailContent"></div>
  </section>

  <nav id="bottomNav" class="bottomNav glass">
    <button data-tab="overview" class="active"><span>⌂</span><b>Übersicht</b></button>
    <button data-tab="journal"><span>▤</span><b>Journal</b></button>
    <button data-tab="map"><span>▱</span><b>Karte</b></button>
    <button data-tab="trips"><span>◉</span><b>Reisen</b></button>
    <button data-tab="options"><span>☷</span><b>Optionen</b></button>
  </nav>
  <button id="navOrb" class="navOrb hidden"><span>▱</span></button>
  <button id="fullscreenClose" class="fullscreenClose glass hidden">×</button>
  <div id="toast"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./pr-data.js"></script>
<script src="./app.js"></script>
</body></html>
